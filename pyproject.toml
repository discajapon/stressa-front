[project]
name = "reparto"
version = "0.1.0"
description = "Reparto Discayama: reparto diario por contribución real, evaluada por un LLM"
requires-python = ">=3.12"
dependencies = ["requests", "Pillow", "discord.py>=2.4"]

[project.scripts]
reparto = "reparto.cli:main"
reparto-bot = "reparto.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reparto"]

[tool.setuptools.package-data]
reparto = ["prompts/*.md"]
